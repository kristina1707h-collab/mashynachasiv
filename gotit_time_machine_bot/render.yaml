services:
  - type: web
    name: gotit-time-machine-bot
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////data/bot.db
      - key: TIMEZONE
        value: Europe/Kyiv
      - key: POLLING
        value: "false"
    disk:
      name: gotit-data
      mountPath: /data
      sizeGB: 1
